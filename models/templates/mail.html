<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html data-editor-version="2" class="sg-campaigns" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" /><!--[if !mso]><!-->
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" /><!--<![endif]-->
    <!--[if (gte mso 9)|(IE)]>
    <xml>
    <o:OfficeDocumentSettings>
    <o:AllowPNG/>
    <o:PixelsPerInch>96</o:PixelsPerInch>
    </o:OfficeDocumentSettings>
    </xml>
    <![endif]-->
    <!--[if (gte mso 9)|(IE)]>
    <style type="text/css">
      body {width: 600px;margin: 0 auto;}
      table {border-collapse: collapse;}
      table, td {mso-table-lspace: 0pt;mso-table-rspace: 0pt;}
      img {-ms-interpolation-mode: bicubic;}
    </style>
    <![endif]-->

    <style type="text/css">
      body, p, div {
        font-family: arial;
        font-size: 14px;
      }
      body {
        color: #000000;
      }
      body a {
        color: #1188E6;
        text-decoration: none;
      }
      p { margin: 0; padding: 0; }
      table.wrapper {
        width:100% !important;
        table-layout: fixed;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
        -moz-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }
      table thead .th-title {
        padding: 8px;
      }
      table thead .bg-blue-light {
        background-color: #f0f8ff;
      }
      table tbody.main tr:nth-child(odd) {
        background-color: #f0f0f0;
      }
      img.max-width {
        max-width: 100% !important;
      }
      @media screen and (max-width:480px) {
        .preheader .rightColumnContent,
        .footer .rightColumnContent {
            text-align: left !important;
        }
        .preheader .rightColumnContent div,
        .preheader .rightColumnContent span,
        .footer .rightColumnContent div,
        .footer .rightColumnContent span {
          text-align: left !important;
        }
        .preheader .rightColumnContent,
        .preheader .leftColumnContent {
          font-size: 80% !important;
          padding: 5px 0;
        }
        table.wrapper-mobile {
          width: 100% !important;
          table-layout: fixed;
        }
        img.max-width {
          height: auto !important;
          max-width: 480px !important;
        }
        .columns {
          width: 100% !important;
        }
        .column {
          display: block !important;
          width: 100% !important;
          padding-left: 0 !important;
          padding-right: 0 !important;
          margin-left: 0 !important;
          margin-right: 0 !important;
        }
        .total_spacer {
          padding:0px 0px 0px 0px;
        }
      }
    </style>
    <!--user entered Head Start-->

     <!--End Head user entered-->
  </head>
  <body>
    <center class="wrapper" data-link-color="#1188E6" data-body-style="font-size: 14px; font-family: arial; color: #000000; background-color: #ebebeb;">
      <div class="webkit">
        <table cellpadding="0" cellspacing="0" border="0" width="100%" class="wrapper" bgcolor="#ebebeb">
          <tr>
            <td valign="top" bgcolor="#ebebeb" width="100%">
              <table width="100%" role="content-container" class="outer" align="center" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td width="100%">
                    <table width="100%" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                            <td>
                            <!--[if mso]>
                            <center>
                            <table><tr><td width="900">
                            <![endif]-->
                            <table width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width:900px;" align="center">
                            <tr>
                                <td role="modules-container" style="padding: 0px 0px 0px 0px; color: #000000; text-align: left;" bgcolor="#ffffff" width="100%" align="left">
                                    <table class="module preheader preheader-hide" role="module" data-type="preheader" border="0" cellpadding="0" cellspacing="0" width="100%"
                                        style="display: none !important; mso-hide: all; visibility: hidden; opacity: 0; color: transparent; height: 0; width: 0;">
                                    <tr>
                                        <td role="module-content">
                                        <p></p>
                                        </td>
                                    </tr>
                                    </table>

                                    <table class="wrapper" role="module" data-type="image" border="0" cellpadding="0" cellspacing="0" width="100%" style="table-layout: fixed;">
                                    <tr>
                                        <td style="font-size:6px;line-height:10px;padding:0px 0px 0px 0px;" valign="top" align="center">
                                        <img class="max-width" border="0" style="display:block;color:#000000;text-decoration:none;font-family:Helvetica, arial, sans-serif;font-size:16px;max-width:100% !important;width:100%;height:auto !important;" src="https://marketing-image-production.s3.amazonaws.com/uploads/b09553df6918fe296ecfc240db655a184ff3a1317ee2d54e13d532e60177715894449dc25615184d98cf1c480c7935c7953cf6eeef5742bfdb6a66aecb5eabee.png" alt="" width="600">
                                        </td>
                                    </tr>
                                    </table>

                                    <table class="module" role="module" data-type="text" border="0" cellpadding="0" cellspacing="0" width="100%" style="table-layout: fixed;">
                                        <tr>
                                            <td style="padding:25px 20px 25px 20px;line-height:20px;text-align:inherit;"
                                                height="100%"
                                                valign="top"
                                                bgcolor="">
                                                <h2 style="text-align: center;">Licitación</h2>
                                            </td>
                                        </tr>
                                    </table>

                                    <table class="module" role="module" data-type="code" border="0" cellpadding="0" cellspacing="0" width="95%" style="table-layout: fixed; margin: 0 auto;">
                                        <thead>
                                            <tr class="bg-blue-light">
                                                <th scope="col" class="th-title">
                                                    <div class="cabeceraTexto" bis_skin_checked="1"><strong dir="ltr" lang="es" xml:lang="es">Expediente</strong>
                                                    </div>
                                                </th>
                                                <th scope="col" class="th-title">
                                                    <div class="cell-order" bis_skin_checked="1"><strong dir="ltr" lang="es" xml:lang="es">Estado</strong>
                                                    </div>
                                                </th>
                                                <th scope="col" class="th-title">
                                                    <div class="cell-order" bis_skin_checked="1"><strong dir="ltr" lang="es" xml:lang="es">Importe</strong>
                                                    </div>
                                                </th>
                                                <th scope="col" class="th-title">
                                                    <div class="cell-order" bis_skin_checked="1"><strong dir="ltr" lang="es" xml:lang="es">Presentación</strong>
                                                    </div>
                                                </th>
                                                <th scope="col" class="th-title">
                                                    <div class="cell-order" bis_skin_checked="1"><strong dir="ltr" lang="es" xml:lang="es">Órgano de Contratación</strong>
                                                    </div>
                                                </th>
                                            </tr>
                                        </thead>
                                        <tbody class="main">
                                            {{#each data}}
                                                <tr>
                                                    <td style="padding: 8px;">
                                                        <a href="{{href}}" class="font-bold text-foreground text-sm @sm:text-base @lg:text-lg leading-tight mb-3 @sm:mb-4 line-clamp-2 cursor-pointer hover:underline block"><span>Sistema dinámico para el suministro de la alimentación del ganado vacuno de la finca mouriscade</span></a>
                                                        <div style="text-align: left;">{{name}}</div>
                                                    </td>
                                                    <td style="padding: 8px;"><div style="text-align: left;">{{status}}</div></td>
                                                    <td style="padding: 8px;"><div style="text-align: left;">{{budgetNoTaxes}}</div></td>
                                                    <td style="padding: 8px;"><div style="text-align: left;">{{expedientPublishedAt}}</div></td>
                                                    <td style="padding: 8px;"><div style="text-align: left;">{{contractingOrganization.name}}</div></td>
                                                </tr>
                                                <tr>
                                            {{/each}}
                                        </tbody>
                                    </table>

                                    <table class="module"
                                        role="module"
                                        data-type="divider"
                                        border="0"
                                        cellpadding="0"
                                        cellspacing="0"
                                        width="100%"
                                        style="table-layout: fixed;">
                                        <tr>
                                            <td style="padding:0px 0px 0px 0px;"
                                                role="module-content"
                                                height="100%"
                                                valign="top"
                                                bgcolor="">
                                            <table border="0"
                                                    cellpadding="0"
                                                    cellspacing="0"
                                                    align="center"
                                                    width="100%"
                                                    height="5px"
                                                    style="line-height:5px; font-size:5px;">
                                                <tr>
                                                <td
                                                    style="padding: 0px 0px 5px 0px;"
                                                    bgcolor="#ebebeb"></td>
                                                </tr>
                                            </table>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                            </table>
                            <!--[if mso]>
                            </td></tr></table>
                            </center>
                            <![endif]-->
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </div>
    </center>
  </body>
</html>

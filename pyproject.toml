[project]
name = "rocio-scrape"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "certifi>=2024.0.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.5",
    "playwright>=1.57.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "playwright==1.57.0",
    "ruff>=0.8.0",
    "pytest>=9.0.3",
    "pytest-asyncio",
    "requests==2.32.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
